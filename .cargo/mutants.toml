# cargo-mutants: run with `cargo mutants` (everything, slow) or
# `cargo mutants --in-diff <patch>` (what a change touched, as CI does on
# every pull request). A mutant that survives is a test that is missing.

# Code no test can reach without a terminal, a clipboard or a child
# process of its own: the main loop, signal
# handlers, which descriptor is the terminal (`input::terminal`, stdin
# when it is one; the waiting on it is tested), the clipboard tools, the
# screen stepping aside for a `!` command (`run_in`, which runs the
# command, is tested) or for the editor (`editor::run`; `edit`, which
# runs it, is tested), the question to
# the terminal about its colours (`probe`; the parsing is tested), the
# screen's take-over and what asks the terminal its size or cursor
# (`screen`; the row-by-row erase is tested).
# `free_project_name` tries `projects.len() + 2` numbers: more than it can
# ever need, since each taken name is a project. A bound made larger
# (`+` → `*`) changes nothing a test can see; a smaller one is caught.
# `child::ENDED` joins waitid's flags, distinct bits, with `|`: `^` gives
# the same number, so no test can tell them apart (`&` is caught); so do
# `input::seen`'s poll flags, `live::setup::look`'s open flags
# (`&` is caught by a pipe in the script's place) and
# `copy::read_include`'s (`&` is caught by a link in the file's place).
# `child::bsd_parent` is built on macOS only and the mutation run is on
# Linux, where nothing of it compiles; its test (`parent_of`'s) runs in the
# macOS test job.
# `Live::step` made to do nothing (`-> bool with false`) is caught, but
# slowly: every live test that waits for what a step brings (a session's
# report, git's answer) waits its full ten seconds first, and together
# they outlast the run's timeout, so it is reported as one.
# Its twin (`-> bool with true`, every step said to bring something) is
# caught by three tests (`a_step_says_whether_anything_came_the_screen_may_show`,
# `a_live_step_draws_only_when_something_came`, `a_step_that_takes_a_look_s_
# answer_says_something_came`; 16 s locally, 2026-11-04), but the last one
# waits its ten seconds for a quiet step first and the run outlasted its
# timeout on CI (#277), so it is left out the same way.
# `Live::take_git` the same (`-> bool with false` or `true`): with its body
# gone git's answers are never taken, every live test that waits for one
# waits its ten seconds, and the run reports a timeout for what is caught
# (#280). It is a boundary path, so its timeout held the PR.
# `child::exited` said to see no end (`-> Ok(false)`) is caught by every
# test that waits for a child's end, each waiting its full ten seconds
# first; together they outlast the run's timeout (the nightly of
# 2026-11-07), so it is left out the same way.
# `lonca_fake` is a test double behind a feature, never in a build of
# imece; a mutant in it fails or passes what it stands in for.
# `lonca::read_session` joins open flags with `|` as `input::seen` does:
# `^` gives the same number (`&` is caught by a link in the file's place).
# A pattern matches the mutant's full name, `path:line:col: replace fn ...`.
exclude_re = [
    "src/model.rs:.*: replace \\+ with \\* in free_project_name",
    "src/live/mod.rs:.*: replace Live::step -> bool with (false|true)$",
    "src/live/changes.rs:.*: replace Live::take_git -> bool with (false|true)$",
    "src/child.rs:.*: replace \\| with \\^$",
    "src/child.rs:.*: replace exited -> io::Result<bool> with Ok\\(false\\)$",
    "src/lonca_fake.rs:.*",
    "src/lonca.rs:.*: replace \\| with \\^ in read_session$",
    "src/child.rs:.*: replace bsd_parent ",
    "src/child.rs:.*: (replace|delete) .* in bsd_parent$",
    "src/main.rs:.*: replace (main|run|catch_signals|on_signal|poll_terminal) ",
    "src/main.rs:.*: (replace|delete) .* in (main|run|catch_signals|on_signal|poll_terminal)$",
    "src/input.rs:.*: replace terminal ",
    "src/input.rs:.*: (replace|delete) .* in terminal$",
    "src/input.rs:.*: replace \\| with \\^ in seen$",
    "src/live/setup.rs:.*: replace \\| with \\^ in look$",
    "src/copy.rs:.*: replace \\| with \\^ in read_include$",
    "src/clip.rs:.*: replace (copy|tools|pipe|osc52) ",
    "src/clip.rs:.*: replace .* in (copy|tools|pipe|osc52)$",
    "src/shell.rs:.*: replace (run|step_aside|wait_for_key|come_back) ",
    "src/shell.rs:.*: (replace|delete) .* in (run|step_aside|wait_for_key|come_back)$",
    "src/editor.rs:.*: replace run ",
    "src/editor.rs:.*: (replace|delete) .* in run$",
    "src/probe.rs:.*: replace (terminal|ask|asked|colours_again|readable) ",
    "src/probe.rs:.*: (replace|delete) .* in (terminal|ask|asked|colours_again|readable)$",
    "src/screen.rs:.*: replace (init|restore|terminal_rows|<impl Backend for Quiet<W>>::(size|window_size|get_cursor_position)) ",
    "src/screen.rs:.*: (replace|delete) .* in (init|restore|terminal_rows|<impl Backend for Quiet<W>>::(size|window_size|get_cursor_position))$",
]

# Builds and tests as CI does, from the lockfile.
additional_cargo_args = ["--locked"]

# The suite is quick; a mutant that makes it three times slower hangs.
timeout_multiplier = 3.0
minimum_test_timeout = 20.0
