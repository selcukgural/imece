[package]
name = "imece-tui"
description = "imece's screen: many agents from many vendors in one terminal, on fake events or live agents"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "imece"
path = "src/main.rs"

[dependencies]
# crossterm comes through ratatui (`ratatui::crossterm`), so the two can not
# drift apart.
# Line counts of wrapped text, to keep the newest lines of a long story in view.
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
imece-agent = { path = "../imece-agent" }
# Wrapping a conversation by cell width, so every row keeps its gutter.
unicode-width = "=0.2.3"
# The arguments of agents' tool calls.
serde_json = "=1.0.154"
# The local clock for live agents (`localtime_r`).
libc = "=0.2.191"
# What imece remembers between runs (projects, agents, cards, the journal,
# mail), one SQLite file; bundled, so the build needs no system library.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
# Journal and story events as JSON in that file.
serde = { version = "=1.0.229", features = ["derive"] }
