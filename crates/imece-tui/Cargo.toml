[package]
# The crate is named after its program (`cargo install imece`); its
# directory keeps the name it had.
name = "imece"
description = "One terminal for a team of Claude Code agents: a leader that hires workers, each in its own worktree, and nothing reaches your checkout until you have read the change"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["claude", "agents", "tui", "terminal", "git"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "imece"
path = "src/main.rs"

[dependencies]
# crossterm comes through ratatui (`ratatui::crossterm`), so the two can not
# drift apart.
# Line counts of wrapped text, to keep the newest lines of a long story in view.
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
imece-agent = { workspace = true }
# Wrapping a conversation by cell width, so every row keeps its gutter.
unicode-width = "=0.2.3"
# The arguments of agents' tool calls.
serde_json = "=1.0.154"
# The local clock for live agents (`localtime_r`).
libc = "=0.2.191"
# A change of the terminal's size wakes the main loop's wait (`input::Wake`):
# the crate crossterm already registers SIGWINCH with, so the two share one
# handler instead of taking it from each other.
signal-hook = { version = "=0.3.18", default-features = false }
# What imece remembers between runs (projects, agents, cards, the journal,
# mail), one SQLite file; bundled, so the build needs no system library.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
# Journal and story events as JSON in that file.
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
# A daemon that speaks Lonca's protocol, for the store's tests.
imece-agent = { path = "../imece-agent", features = ["fake"] }
