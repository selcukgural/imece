[package]
name = "imece-agent"
description = "Drives Claude Code sessions as child processes and reports what they do as events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A daemon that speaks Lonca's protocol, for tests.
fake = []

[dependencies]
# Process groups (`killpg`): an agent's tools must die with the agent.
libc = "=0.2.191"
serde_json = "=1.0.154"
