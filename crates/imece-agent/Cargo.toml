[package]
name = "imece-agent"
description = "Drives Claude Code sessions as child processes and reports what they do as events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# A daemon that speaks Lonca's protocol, for tests.
fake = []

[dependencies]
# Process groups (`killpg`): an agent's tools must die with the agent.
libc = "=0.2.191"
serde_json = "=1.0.154"
# Lonca's own client of its daemon socket (record 116): the socket and its
# peer checked against what the machine's install names, the framing, the
# timeout, the human session file. imece's reading of the answers is its own.
lonca-client = "=0.2.2"
