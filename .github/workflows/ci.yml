name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # fuzz/ has its own lock, which names the workspace's version: a
      # version bump that leaves it behind stops every fuzz run at
      # --locked (record 139; the v0.1.202611111627 tag's run).
      - name: fuzz/Cargo.lock is up to date
        run: cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

  # install.sh (website/static) end to end against a release made from this
  # build: the download, the checksum, the install, the PATH line, the
  # refusals (website/test-install.sh); record 69.
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck website/static/install.sh website/test-install.sh tools/acceptance/setup.sh
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo build --locked -p imece
      - run: website/test-install.sh target/debug/imece

  # The acceptance catalogue (docs/acceptance, record 147) names every
  # decision record and `:` command, and its tools refuse what they must;
  # release.yml's gate reads the same catalogue.
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Every record and command has its case
        run: python3 -I tools/acceptance.py check
      - name: The acceptance tools' tests
        run: python3 -I -m unittest discover -s tools -p 'test_*.py'

  # The scripted acceptance cases (docs/acceptance, record 147): the real
  # Live on imece's stand-in for Claude Code, every PR, nothing spent. A
  # failure's screens and every key sent are kept as an artifact.
  acceptance-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tmux
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            command -v tmux || brew install tmux
          fi
          tmux -V
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo build --locked -p imece
      - name: The stand-in's world
        run: IMECE_ACC_BIN="$PWD/target/debug/imece" tools/acceptance/setup.sh --stand-in "$RUNNER_TEMP/acc"
      - name: Every scripted case
        run: |
          . "$RUNNER_TEMP/acc/env.sh"
          python3 -I tools/acceptance/drive.py run --jobs 4
      - name: What the failed cases showed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-scripts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acc/out
            ${{ runner.temp }}/acc/drive.log
          if-no-files-found: ignore
