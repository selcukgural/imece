name: release

# A tag `vX.Y.Z` (the version in Cargo.toml) builds imece for every system
# install.sh serves and publishes them as that tag's GitHub release:
# imece-<target>.tar.gz (imece and LICENSE at its top) for macOS arm64 and
# x86_64 and Linux x86_64 and arm64 (static, musl), SHA256SUMS, and a
# build provenance attestation for each archive
# (`gh attestation verify imece-….tar.gz --repo selcukgural/imece`).
# install.sh (website/static) downloads them, the Homebrew tap
# (selcukgural/homebrew-imece) reads the latest release by itself, and the
# last two jobs put the crates on crates.io; record 69.
#
# The builds run third-party code (crates' build scripts) and see no
# credential; only the publish job may write the release or mint the token
# the attestation needs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      # Every build runs to its end, so one failure shows all there are;
      # publish needs all four anyway.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag is the version in Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG is not v$version (Cargo.toml)" >&2
            exit 1
          fi
      - name: Rust toolchain (rust-toolchain.toml) and the target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
      - name: musl's C compiler (bundled SQLite)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p imece
      - name: Runs and says its version
        # The x86_64 macOS build is made on Apple silicon, which may not run it.
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          said=$("target/$TARGET/release/imece" --version)
          test "$said" = "imece ${TAG#v}" || { echo "said: $said" >&2; exit 1; }
      - name: Static on Linux
        if: runner.os == 'Linux'
        run: |
          # `file` says "statically linked", or "static-pie linked" for a
          # position-independent one (x86_64 musl).
          file "target/$TARGET/release/imece" | tee /dev/stderr |
            grep -Eq 'statically linked|static-pie linked'
      - name: Package
        run: |
          mkdir -p pack dist
          cp "target/$TARGET/release/imece" LICENSE pack/
          tar -C pack -czf "dist/imece-$TARGET.tar.gz" imece LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: imece-${{ matrix.target }}
          path: dist/imece-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release and its files
      id-token: write # the OIDC token the provenance attestation is signed with
      attestations: write # the attestation itself
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: imece-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -- imece-*.tar.gz
          test "$#" -eq 4
          sha256sum imece-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/imece-*.tar.gz
      - name: The release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --verify-tag \
            --title "imece $TAG" \
            --generate-notes \
            --notes "Install or update (macOS and Linux, x86_64 and arm64): \`curl -fsSL https://selcukgural.github.io/imece/install.sh | sh\`, or \`brew install selcukgural/imece/imece\`, or \`cargo install --locked imece\`. Check an archive: \`gh attestation verify imece-<target>.tar.gz --repo $REPO\`."

  # crates.io (`cargo install imece`): the same version of both crates, once
  # the release is out. Off until the repository variable PUBLISH_CRATES says
  # `true`. These two jobs are Lonca's registries.yml (VENDORED.md), inside
  # this workflow because a release made with the workflow's own token
  # starts no other workflow.
  #
  # No registry token is kept anywhere. crates.io trusts this repository's
  # release.yml in the `release` environment and hands out a token that
  # lives for one job. Trusted publishing needs the crate to exist, so each
  # crate's first version is published by hand; then, on crates.io, each
  # crate's settings → Trusted Publishing → GitHub: selcukgural/imece,
  # workflow release.yml, environment release.
  #
  # Packages and builds what would go up, as crates.io would. Building runs
  # every dependency's build scripts, so this job can mint no token.
  crates-check:
    if: vars.PUBLISH_CRATES == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Package and build the workspace, without uploading
        run: cargo publish --workspace --locked --dry-run

  # Uploads what crates-check built, from the same tag. It builds nothing
  # (`--no-verify`), so no dependency's code runs while the token exists.
  crates:
    needs: crates-check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write # exchanged for a crates.io token that lives for this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish, in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked --no-verify
