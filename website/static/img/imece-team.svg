<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t" xml:space="preserve">
  <title id="t">imece: you ask the leader, a team works on one job, and the change waits for you before it reaches your checkout</title>
  <!-- imece's mark, five hands round one job, drawn large: your request goes
       to the leader, the team works around one job, and what it made waits
       as a change (Δ) before it reaches your checkout. Moves only when the
       reader allows motion. -->
  <defs>
    <radialGradient id="glow" cx="600" cy="280" r="330" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e3a93f" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#e3a93f" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#e3a93f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="job" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dae0"/>
    </radialGradient>
    <radialGradient id="hand" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#f3c66c"/>
      <stop offset="1" stop-color="#c98a2a"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e3a93f"/>
    </marker>
  </defs>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .name { fill: #f4f4f6; font-size: 19px; }
    .dim { fill: #8a8d99; }
    .gold { fill: #e3a93f; }
    .ok { fill: #6cc287; }
    .bad { fill: #e06c75; }
    .flow { stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
    .breath { animation: breath 2.4s ease-in-out infinite; }
    .b1 { animation-delay: -0.5s; }
    .b2 { animation-delay: -1.1s; }
    .b3 { animation-delay: -1.7s; }
    .spin { transform-origin: 600px 280px; animation: spin 60s linear infinite; }
    .delta { animation: travel 3.2s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    @keyframes breath { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(212px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .breath, .spin, .delta { animation: none; }
      .delta { opacity: 0; }
    }
  </style>

  <!-- ground -->
  <rect width="1200" height="560" rx="18" fill="#15161b"/>
  <rect width="1200" height="560" rx="18" fill="url(#dots)"/>
  <circle cx="600" cy="280" r="330" fill="url(#glow)"/>

  <!-- the ring the hands stand on -->
  <circle cx="600" cy="280" r="150" fill="none" stroke="#e3a93f" stroke-opacity="0.18" stroke-width="1.5"/>
  <g class="spin">
    <circle cx="600" cy="280" r="196" fill="none" stroke="#e3a93f" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 10"/>
  </g>

  <!-- each hand on the job -->
  <g stroke="#e3a93f" stroke-opacity="0.35" stroke-width="2">
    <line x1="600" y1="130" x2="600" y2="280"/>
    <line x1="742.7" y1="233.6" x2="600" y2="280"/>
    <line x1="688.2" y1="401.4" x2="600" y2="280"/>
    <line x1="511.8" y1="401.4" x2="600" y2="280"/>
    <line x1="457.3" y1="233.6" x2="600" y2="280"/>
  </g>

  <!-- your request, to the leader -->
  <g>
    <rect x="48" y="246" width="262" height="68" rx="10" fill="#1d1f26" stroke="#2e313b"/>
    <text x="68" y="275" class="dim" font-size="14">you</text>
    <text x="68" y="300" font-size="18"><tspan class="gold">›</tspan><tspan fill="#f4f4f6"> rate-limit the api</tspan></text>
    <path class="flow" d="M300 246 C 340 120, 450 100, 566 124" fill="none" stroke="#e3a93f" stroke-width="2" marker-end="url(#tip)"/>
  </g>

  <!-- the job -->
  <circle cx="600" cy="280" r="44" fill="#ffffff" fill-opacity="0.12" filter="url(#soft)"/>
  <circle cx="600" cy="280" r="30" fill="url(#job)"/>

  <!-- the five hands: the leader and its team -->
  <circle cx="600" cy="130" r="38" fill="#e3a93f" fill-opacity="0.18" filter="url(#soft)"/>
  <circle cx="600" cy="130" r="27" fill="url(#hand)"/>
  <circle class="breath" cx="742.7" cy="233.6" r="24" fill="url(#hand)"/>
  <circle class="breath b2" cx="688.2" cy="401.4" r="24" fill="url(#hand)"/>
  <circle cx="511.8" cy="401.4" r="24" fill="url(#hand)"/>
  <circle class="breath b1" cx="457.3" cy="233.6" r="24" fill="url(#hand)"/>

  <!-- who they are, as the screen words them -->
  <text x="600" y="84" text-anchor="middle" class="name">leader</text>
  <text x="780" y="240" class="name"><tspan class="gold breath">●</tspan> api</text>
  <text x="724" y="452" class="name"><tspan class="gold breath b2">●</tspan> limits</text>
  <text x="476" y="452" text-anchor="end" class="name"><tspan class="ok">✓</tspan> tests</text>
  <text x="420" y="225" text-anchor="end" class="name"><tspan class="gold breath b1">●</tspan> docs</text>

  <!-- what the team made, on its way to you -->
  <path class="flow" d="M636 280 H 872" fill="none" stroke="#e3a93f" stroke-width="2" marker-end="url(#tip)"/>
  <g class="delta">
    <text x="652" y="272" class="gold" font-size="16" text-anchor="middle">Δ</text>
  </g>

  <!-- the gate: the change waits for you -->
  <rect x="880" y="226" width="272" height="108" rx="10" fill="#1d1f26" stroke="#e3a93f" stroke-opacity="0.75" stroke-width="1.5"/>
  <text x="902" y="258" font-size="17"><tspan class="gold breath b3">!</tspan><tspan fill="#f4f4f6"> Δ waits for you</tspan></text>
  <text x="902" y="285" font-size="15"><tspan class="ok">+42</tspan><tspan class="bad"> −7</tspan><tspan class="dim"> · 3 files</tspan></text>
  <text x="902" y="310" font-size="15"><tspan class="ok">✓</tspan><tspan class="dim"> tests pass · ready</tspan></text>

  <!-- yes: into your checkout -->
  <path class="flow" d="M1016 334 V 392" fill="none" stroke="#e3a93f" stroke-width="2" marker-end="url(#tip)"/>
  <text x="1034" y="370" class="dim" font-size="14">a</text>
  <rect x="908" y="400" width="216" height="50" rx="10" fill="#1d1f26" stroke="#2e313b"/>
  <text x="1016" y="431" text-anchor="middle" font-size="16"><tspan class="ok">✓</tspan><tspan fill="#f4f4f6"> your checkout</tspan></text>
</svg>
